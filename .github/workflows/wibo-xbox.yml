# A tag wibo-xbox-* builds the wibo that Xbox projects use (the commit packaging/wibo/wibo.ref pins: our wibo fork's
# `xbox` branch, decompals/wibo 1.2.0 plus the XDK 5849 linker patches) and publishes it as a GitHub release of this
# repository, which toolchains.toml's [wibo-xbox] entry pins by sha256. It builds in wibo's own Alpine image, as
# wibo's CI does, so the binary is static and wibo's test suite runs on it first. It can also be run by hand for a
# tag that's already pushed: gh workflow run wibo-xbox -f tag=wibo-xbox-1.2.0-4
name: wibo-xbox

on:
  push:
    tags: ["wibo-xbox-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build and release (wibo-xbox-...)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: read the pinned wibo commit
        id: ref
        run: |
          echo "repo=$(sed -n 's/^repo=//p' packaging/wibo/wibo.ref)" >> "$GITHUB_OUTPUT"
          echo "commit=$(sed -n 's/^commit=//p' packaging/wibo/wibo.ref)" >> "$GITHUB_OUTPUT"
      - name: check out wibo at that commit
        run: |
          git clone "${{ steps.ref.outputs.repo }}" wibo-src
          git -C wibo-src checkout "${{ steps.ref.outputs.commit }}"
          echo "WIBO_VERSION=$(git -C wibo-src describe --tags --always)" >> "$GITHUB_ENV"
      - name: build (wibo's Dockerfile, static release)
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: wibo-src
          file: wibo-src/Dockerfile
          target: build
          build-args: |
            BUILD_TYPE=release
            WIBO_VERSION=${{ env.WIBO_VERSION }}
          platforms: linux/amd64
          load: true
      - name: wibo's tests
        run: docker run --rm ${{ steps.docker-build.outputs.imageid }} ctest --test-dir /wibo/build --output-on-failure
      - name: export the binary
        uses: docker/build-push-action@v6
        with:
          context: wibo-src
          file: wibo-src/Dockerfile
          target: export
          build-args: |
            BUILD_TYPE=release
            WIBO_VERSION=${{ env.WIBO_VERSION }}
          platforms: linux/amd64
          outputs: type=local,dest=dist
      - name: name it and checksum it
        run: |
          mv dist/wibo dist/wibo-xbox-x86_64
          (cd dist && sha256sum wibo-xbox-x86_64 > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="wibo for Xbox XDK 5849 projects: ${{ steps.ref.outputs.repo }} at ${{ steps.ref.outputs.commit }} ($WIBO_VERSION), built statically in wibo's Alpine image after its test suite passed."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/wibo-xbox-x86_64 dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/wibo-xbox-x86_64 dist/SHA256SUMS --title "$TAG" --notes "$notes" --latest=false
          fi
